<VirtualHost *:80>
    ServerName blogn2.local
    ServerAlias www.blogn2.local
    
    # 日志文件
    ErrorLog ${APACHE_LOG_DIR}/blogn2_error.log
    CustomLog ${APACHE_LOG_DIR}/blogn2_access.log combined
    
    # 反向代理配置
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    
    # 允许代理
    <Location />
        Require all granted
    </Location>
    
    # 安全头设置
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost> 
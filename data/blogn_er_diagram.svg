<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .entity-box {
        fill: #f8f9fa;
        stroke: #495057;
        stroke-width: 2;
        rx: 8;
        ry: 8;
      }
      .core-entity {
        fill: #e3f2fd;
        stroke: #1976d2;
      }
      .aux-entity {
        fill: #f3e5f5;
        stroke: #7b1fa2;
      }
      .entity-title {
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: bold;
        fill: #212529;
        text-anchor: middle;
      }
      .entity-field {
        font-family: Arial, sans-serif;
        font-size: 11px;
        fill: #495057;
        text-anchor: start;
      }
      .relationship-line {
        stroke: #6c757d;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .many-to-many-line {
        stroke: #6c757d;
        stroke-width: 2;
        stroke-dasharray: 5,5;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .relationship-label {
        font-family: Arial, sans-serif;
        font-size: 10px;
        fill: #495057;
        text-anchor: middle;
        background: white;
      }
      .legend-box {
        fill: white;
        stroke: #dee2e6;
        stroke-width: 1;
        rx: 4;
        ry: 4;
      }
      .legend-text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        fill: #495057;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c757d"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#ffffff"/>
  
  <!-- 核心实体 -->
  
  <!-- users表 -->
  <rect x="550" y="350" width="100" height="80" class="entity-box core-entity"/>
  <text x="600" y="370" class="entity-title">users</text>
  <text x="560" y="385" class="entity-field">• id (PK)</text>
  <text x="560" y="400" class="entity-field">• name</text>
  <text x="560" y="415" class="entity-field">• email</text>
  <text x="560" y="430" class="entity-field">• password</text>
  
  <!-- project表 -->
  <rect x="750" y="200" width="100" height="80" class="entity-box core-entity"/>
  <text x="800" y="220" class="entity-title">project</text>
  <text x="760" y="235" class="entity-field">• id (PK)</text>
  <text x="760" y="250" class="entity-field">• name</text>
  <text x="760" y="265" class="entity-field">• userid (FK)</text>
  <text x="760" y="280" class="entity-field">• folderid (FK)</text>
  
  <!-- folders表 -->
  <rect x="350" y="200" width="100" height="80" class="entity-box core-entity"/>
  <text x="400" y="220" class="entity-title">folders</text>
  <text x="360" y="235" class="entity-field">• id (PK)</text>
  <text x="360" y="250" class="entity-field">• name</text>
  <text x="360" y="265" class="entity-field">• parent (FK)</text>
  <text x="360" y="280" class="entity-field">• projectid (FK)</text>
  
  <!-- post表 -->
  <rect x="350" y="500" width="100" height="80" class="entity-box core-entity"/>
  <text x="400" y="520" class="entity-title">post</text>
  <text x="360" y="535" class="entity-field">• id (PK)</text>
  <text x="360" y="550" class="entity-field">• userid (FK)</text>
  <text x="360" y="565" class="entity-field">• folderid (FK)</text>
  <text x="360" y="580" class="entity-field">• subject</text>
  
  <!-- projectitem表 -->
  <rect x="750" y="500" width="100" height="80" class="entity-box core-entity"/>
  <text x="800" y="520" class="entity-title">projectitem</text>
  <text x="760" y="535" class="entity-field">• id (PK)</text>
  <text x="760" y="550" class="entity-field">• projectid (FK)</text>
  <text x="760" y="565" class="entity-field">• name</text>
  <text x="760" y="580" class="entity-field">• folderid (FK)</text>
  
  <!-- 辅助实体 -->
  
  <!-- attachment表 -->
  <rect x="950" y="350" width="100" height="60" class="entity-box aux-entity"/>
  <text x="1000" y="370" class="entity-title">attachment</text>
  <text x="960" y="385" class="entity-field">• id (PK)</text>
  <text x="960" y="400" class="entity-field">• parentid (FK)</text>
  
  <!-- forumlist表 -->
  <rect x="150" y="200" width="100" height="60" class="entity-box aux-entity"/>
  <text x="200" y="220" class="entity-title">forumlist</text>
  <text x="160" y="235" class="entity-field">• id (PK)</text>
  <text x="160" y="250" class="entity-field">• name</text>
  
  <!-- glovar表 -->
  <rect x="150" y="300" width="100" height="60" class="entity-box aux-entity"/>
  <text x="200" y="320" class="entity-title">glovar</text>
  <text x="160" y="335" class="entity-field">• id (PK)</text>
  <text x="160" y="350" class="entity-field">• varname</text>
  
  <!-- iptable表 -->
  <rect x="150" y="400" width="100" height="60" class="entity-box aux-entity"/>
  <text x="200" y="420" class="entity-title">iptable</text>
  <text x="160" y="435" class="entity-field">• id (PK)</text>
  <text x="160" y="450" class="entity-field">• ip</text>
  
  <!-- levels表 -->
  <rect x="150" y="500" width="100" height="60" class="entity-box aux-entity"/>
  <text x="200" y="520" class="entity-title">levels</text>
  <text x="160" y="535" class="entity-field">• id (PK)</text>
  <text x="160" y="550" class="entity-field">• name</text>
  
  <!-- regkey表 -->
  <rect x="550" y="150" width="100" height="60" class="entity-box aux-entity"/>
  <text x="600" y="170" class="entity-title">regkey</text>
  <text x="560" y="185" class="entity-field">• id (PK)</text>
  <text x="560" y="200" class="entity-field">• userid (FK)</text>
  
  <!-- relation表 -->
  <rect x="950" y="200" width="100" height="60" class="entity-box aux-entity"/>
  <text x="1000" y="220" class="entity-title">relation</text>
  <text x="960" y="235" class="entity-field">• id (PK)</text>
  <text x="960" y="250" class="entity-field">• projectid (FK)</text>
  
  <!-- subsc表 -->
  <rect x="950" y="500" width="100" height="60" class="entity-box aux-entity"/>
  <text x="1000" y="520" class="entity-title">subsc</text>
  <text x="960" y="535" class="entity-field">• id (PK)</text>
  <text x="960" y="550" class="entity-field">• projectid (FK)</text>
  
  <!-- urllink表 -->
  <rect x="550" y="600" width="100" height="60" class="entity-box aux-entity"/>
  <text x="600" y="620" class="entity-title">urllink</text>
  <text x="560" y="635" class="entity-field">• id (PK)</text>
  <text x="560" y="650" class="entity-field">• projectid (FK)</text>
  
  <!-- 关系线 -->
  
  <!-- users -> post -->
  <line x1="600" y1="430" x2="400" y2="500" class="relationship-line"/>
  <text x="500" y="470" class="relationship-label">userid</text>
  
  <!-- users -> project -->
  <line x1="650" y1="380" x2="750" y2="280" class="relationship-line"/>
  <text x="700" y="330" class="relationship-label">userid</text>
  
  <!-- users -> projectitem -->
  <line x1="650" y1="390" x2="750" y2="500" class="relationship-line"/>
  <text x="700" y="445" class="relationship-label">userid</text>
  
  <!-- users -> regkey -->
  <line x1="600" y1="350" x2="600" y2="210" class="relationship-line"/>
  <text x="620" y="280" class="relationship-label">userid</text>
  
  <!-- project -> projectitem -->
  <line x1="800" y1="280" x2="800" y2="500" class="relationship-line"/>
  <text x="820" y="390" class="relationship-label">projectid</text>
  
  <!-- project -> folders -->
  <line x1="750" y1="240" x2="450" y2="240" class="relationship-line"/>
  <text x="600" y="230" class="relationship-label">projectid</text>
  
  <!-- folders -> post -->
  <line x1="400" y1="280" x2="400" y2="500" class="relationship-line"/>
  <text x="420" y="390" class="relationship-label">folderid</text>
  
  <!-- folders -> folders (self) -->
  <line x1="350" y1="240" x2="300" y2="240" class="relationship-line"/>
  <text x="325" y="230" class="relationship-label">parent</text>
  
  <!-- projectitem -> post -->
  <line x1="750" y1="540" x2="450" y2="540" class="relationship-line"/>
  <text x="600" y="530" class="relationship-label">projectitemid</text>
  
  <!-- post -> attachment -->
  <line x1="450" y1="540" x2="950" y2="380" class="relationship-line"/>
  <text x="700" y="460" class="relationship-label">parentid</text>
  
  <!-- projectitem -> attachment -->
  <line x1="850" y1="530" x2="950" y2="410" class="relationship-line"/>
  <text x="900" y="470" class="relationship-label">parentid</text>
  
  <!-- post -> post (self) -->
  <line x1="350" y1="520" x2="320" y2="520" class="relationship-line"/>
  <text x="335" y="510" class="relationship-label">rootid</text>
  
  <!-- project -> urllink -->
  <line x1="800" y1="260" x2="600" y2="600" class="relationship-line"/>
  <text x="700" y="430" class="relationship-label">projectid</text>
  
  <!-- 多对多关系 -->
  
  <!-- users <-> project (through relation) -->
  <line x1="650" y1="360" x2="950" y2="230" class="many-to-many-line"/>
  <text x="800" y="290" class="relationship-label">relation</text>
  
  <!-- users <-> projectitem (through subsc) -->
  <line x1="650" y1="400" x2="950" y2="530" class="many-to-many-line"/>
  <text x="800" y="465" class="relationship-label">subsc</text>
  
  <!-- 图例 -->
  <rect x="50" y="650" width="300" height="120" class="legend-box"/>
  <text x="70" y="670" class="legend-text" style="font-weight: bold;">图例</text>
  <rect x="70" y="680" width="20" height="15" class="core-entity"/>
  <text x="100" y="692" class="legend-text">核心实体</text>
  <rect x="70" y="700" width="20" height="15" class="aux-entity"/>
  <text x="100" y="712" class="legend-text">辅助实体</text>
  <line x1="70" y1="720" x2="90" y2="720" class="relationship-line"/>
  <text x="100" y="725" class="legend-text">一对多关系</text>
  <line x1="70" y1="735" x2="90" y2="735" class="many-to-many-line"/>
  <text x="100" y="740" class="legend-text">多对多关系</text>
  
  <!-- 标题 -->
  <text x="600" y="30" class="entity-title" style="font-size: 20px;">BlogN 数据库实体关系图</text>
</svg> 
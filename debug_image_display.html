<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试图片显示 - BlogN2</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .image-test { margin: 10px 0; }
        img { max-width: 300px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>调试图片显示功能</h1>
    
    <div class="debug-section">
        <h2>1. 测试API数据</h2>
        <button onclick="testAPI()">获取文章数据</button>
        <div id="apiResult"></div>
    </div>
    
    <div class="debug-section">
        <h2>2. 测试图片路径</h2>
        <div class="image-test">
            <h3>直接路径测试：</h3>
            <img src="/upload/201004/2010042609f941ece7110d6e.JPG" alt="测试图片1" onerror="this.style.border='2px solid red'; this.alt='加载失败'" onload="this.style.border='2px solid green'">
        </div>
        <div class="image-test">
            <h3>相对路径测试：</h3>
            <img src="http://localhost:8000/upload/201004/2010042609f941ece7110d6e.JPG" alt="测试图片2" onerror="this.style.border='2px solid red'; this.alt='加载失败'" onload="this.style.border='2px solid green'">
        </div>
    </div>
    
    <div class="debug-section">
        <h2>3. 测试组件</h2>
        <article-content-card id="testComponent" article-id="5391"></article-content-card>
    </div>

    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/article-content-card.js"></script>
    
    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('apiResult');
            resultDiv.innerHTML = '获取数据中...';
            
            try {
                const response = await fetch('/api/articles/5391');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <h3>API响应数据:</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p><strong>Attachment字段:</strong> ${data.attachment || '无'}</p>
                        <p><strong>Attachment类型:</strong> ${typeof data.attachment}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="error">API请求失败: ${response.status}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">错误: ${error.message}</p>`;
            }
        }
        
        // 模拟文章页面的URL路径
        // 注意：不能直接修改window.location.pathname，因为它是不可配置的
        // 我们将在组件中直接传递articleId
        
        // 页面加载完成后自动测试
        window.addEventListener('load', testAPI);
    </script>
</body>
</html>

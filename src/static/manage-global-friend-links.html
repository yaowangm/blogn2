<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理全站友情链接 - BlogN2</title>
    <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <div class="management-container" style="width:100%">
                    <div class="page-header" style="margin:16px 0;display:flex;align-items:center;justify-content:space-between">
                        <h1 style="margin:0;font-size:20px">管理全站友情链接</h1>
                    </div>
                    <div class="links-section">
                        <div class="section-header">
                            <h2 class="section-title">
                                友情链接列表
                                <button class="add-button" id="addLinkBtn">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M12 5v14M5 12h14"></path>
                                    </svg>
                                    新建链接
                                </button>
                            </h2>
                        </div>
                        <div class="links-list" id="linksList">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- 图标库 -->
    <script src="/static/js/components/icons.js"></script>

    <!-- 用户管理工具 -->
    <script src="/static/js/utils/user-manager.js"></script>

    <!-- Web Components -->
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>

    <!-- 复用友情链接管理脚本 -->
    <script src="/static/js/manage-friend-links.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 覆盖初始化逻辑：强制使用 project_id=0，且仅管理员可管理
            if (window.friendLinksManager) {
                // 如果已有实例，先不处理（该脚本末尾会创建），我们用一个延时覆盖其状态
            }
            setTimeout(() => {
                if (window.friendLinksManager) {
                    window.friendLinksManager.projectId = 0;
                    // 覆盖权限检查：仅管理员
                    window.friendLinksManager.checkUserPermissions = async function () {
                        if (!UserManager.isLoggedIn()) {
                            this.showError('请先登录');
                            return;
                        }
                        const currentUser = UserManager.getCurrentUser();
                        const isAdmin = currentUser && currentUser.state === 10;
                        if (!isAdmin) {
                            this.showError('仅管理员可以管理全站友情链接');
                            return;
                        }
                    };
                    // 重新绑定事件并加载全站数据
                    window.friendLinksManager.bindEvents();
                    window.friendLinksManager.loadFriendLinks();
                }
            }, 0);
        });
    </script>
</body>
</html>

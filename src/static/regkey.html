<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册码管理 - BlogN</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- 引入CSS基础样式 -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    
    <style>
        .main-content {
            padding: var(--spacing-8) 0;
            min-height: calc(100vh - 200px);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-4);
        }
        
        .content-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-8);
        }
        
        .operation-panel {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: var(--card-padding);
            border: 1px solid var(--card-border);
            text-align: center;
        }
        
        .panel-header {
            margin-bottom: var(--spacing-4);
        }
        
        .panel-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--card-title-weight);
            color: var(--card-title-color);
            margin: 0 0 var(--spacing-3) 0;
        }
        
        .user-points {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-2);
            margin-bottom: var(--spacing-2);
        }
        
        .points-label {
            color: var(--gray-600);
            font-size: var(--font-size-base);
        }
        
        .points-value {
            color: var(--primary-color);
            font-size: var(--font-size-lg);
            font-weight: 600;
        }
        
        .user-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-fast);
        }
        
        .user-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
        
        .user-link::after {
            content: "↗";
            margin-left: 4px;
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        .info-text {
            color: var(--gray-600);
            font-size: var(--font-size-base);
            margin: 0 0 var(--spacing-6) 0;
        }
        
        .exchange-button-container {
            display: flex;
            justify-content: center;
            margin-bottom: var(--spacing-6);
        }
        
        .exchange-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: var(--spacing-3) var(--spacing-6);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
        }
        
        .exchange-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }
        
        .exchange-btn:disabled {
            background: var(--gray-400);
            cursor: not-allowed;
            transform: none;
        }
        
        .regkey-table-container {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            overflow: hidden;
        }
        
        .table-header {
            background: var(--gray-50);
            padding: var(--spacing-4);
            border-bottom: 1px solid var(--gray-200);
        }
        
        .table-title {
            font-size: var(--font-size-lg);
            font-weight: var(--card-title-weight);
            color: var(--card-title-color);
            margin: 0;
        }
        
        .regkey-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .regkey-table th {
            background: var(--gray-50);
            padding: var(--spacing-3) var(--spacing-4);
            text-align: left;
            font-weight: 600;
            color: var(--gray-700);
            border-bottom: 1px solid var(--gray-200);
            font-size: var(--font-size-sm);
        }
        
        .regkey-table td {
            padding: var(--spacing-3) var(--spacing-4);
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-800);
            font-size: var(--font-size-sm);
        }
        
        .regkey-table tr:hover {
            background: var(--gray-50);
        }
        
        .status-badge {
            display: inline-block;
            padding: var(--spacing-1) var(--spacing-2);
            border-radius: var(--radius-sm);
            font-size: var(--font-size-xs);
            font-weight: 500;
            text-align: center;
            min-width: 60px;
        }
        
        .status-unused {
            background: var(--success-color, #10b981);
            color: white;
        }
        
        .status-used {
            background: var(--gray-500);
            color: white;
        }
        
        .loading {
            text-align: center;
            padding: var(--spacing-8);
            color: var(--loading-color);
        }
        
        .error {
            text-align: center;
            padding: var(--spacing-8);
            color: var(--error-color);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--spacing-8);
            color: var(--gray-500);
        }
        
        .empty-state-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--spacing-4);
            color: var(--gray-400);
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 0 var(--spacing-3);
            }
            
            .panel-header {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--spacing-3);
            }
            
            .regkey-table {
                font-size: var(--font-size-xs);
            }
            
            .regkey-table th,
            .regkey-table td {
                padding: var(--spacing-2) var(--spacing-2);
            }
        }
    </style>
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- 操作面板 -->
                <div class="operation-panel">
                    <div class="panel-header">
                        <h1 class="panel-title">注册码管理</h1>
                        <div class="user-points">
                            <span class="points-label">当前积分：</span>
                            <span class="points-value" id="userPoints">--</span>
                        </div>
                    </div>
                    <p class="info-text">使用10分积分可以兑换一个注册码</p>
                    <div class="exchange-button-container">
                        <button class="exchange-btn" id="exchangeBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                                <path d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 0 1 21.75 8.25z"></path>
                            </svg>
                            兑换注册码
                        </button>
                    </div>
                </div>

                <!-- 注册码列表 -->
                <div class="regkey-table-container">
                    <div class="table-header">
                        <h2 class="table-title">注册码列表</h2>
                    </div>
                    <div id="regkeyTableContainer">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- 图标库 -->
    <script src="/static/js/components/icons.js"></script>
    
    <!-- 用户管理工具 -->
    <script src="/static/js/utils/user-manager.js"></script>
    
    <!-- HTML工具 -->
    <script src="/static/js/utils/html-utils.js"></script>
    
    <!-- 令牌管理服务 -->
    
    <!-- 注册码格式化工具 -->
    <script src="/static/js/utils/regkey-formatter.js"></script>
    <script src="/static/js/utils/confirm-dialog.js"></script>
    
    <!-- Web Components -->
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    
    <!-- 注册码管理页面脚本 -->
    <script src="/static/js/regkey.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册码管理 - BlogN</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/management-pages.css">
</head>
<body>
    <header-component></header-component>

    <main class="main-content">
        <div class="container management-container">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">
                        <span class="title-icon" id="regkeyTitleIcon"></span>
                        注册码管理
                    </h1>
                </div>
                <div class="card-body management-hero">
                    <div class="points-badge">
                        <span>当前积分</span>
                        <strong id="userPoints">--</strong>
                    </div>
                    <p class="management-hint">使用 10 分积分可以兑换一个注册码</p>
                    <button type="button" class="btn btn-primary btn-sm" id="exchangeBtn">
                        兑换注册码
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">注册码列表</h2>
                </div>
                <div class="card-body card-body-flush" id="regkeyTableContainer">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
    </main>

    <footer-component></footer-component>

    <script src="/static/js/components/icons.js"></script>
    <script src="/static/js/utils/user-manager.js"></script>
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/utils/regkey-formatter.js"></script>
    <script src="/static/js/utils/confirm-dialog.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/regkey.js"></script>
    <script>
        document.getElementById('regkeyTitleIcon').innerHTML = Icons.registrationCode;
        const exchangeBtn = document.getElementById('exchangeBtn');
        if (exchangeBtn && typeof Icons !== 'undefined') {
            exchangeBtn.insertAdjacentHTML('afterbegin', Icons.registrationCode.replace('<svg ', '<svg width="16" height="16" aria-hidden="true" '));
        }
    </script>
</body>
</html>

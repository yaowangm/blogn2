<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - BlogN</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        .main-content { padding: var(--spacing-8) 0; min-height: calc(100vh - 200px); }
        .container { max-width: 500px; margin: 0 auto; padding: 0 var(--spacing-4); }
        .card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: var(--card-padding);
            border: 1px solid var(--card-border);
        }
        .form-header { text-align: center; margin-bottom: var(--spacing-6); }
        .form-title { font-size: var(--font-size-2xl); font-weight: 600; color: var(--card-title-color); margin: 0 0 var(--spacing-2) 0; }
        .form-subtitle { color: var(--gray-600); font-size: var(--font-size-base); margin: 0; }
        .form-group { margin-bottom: var(--spacing-4); }
        .form-label { display: block; font-weight: 500; color: var(--gray-700); font-size: var(--font-size-sm); margin-bottom: var(--spacing-2); }
        .form-input {
            width: 100%; padding: var(--spacing-3);
            border: 1px solid var(--gray-300); border-radius: var(--radius-md);
            font-size: var(--font-size-base); box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-color-alpha); }
        .form-input.error { border-color: var(--error-color); }
        .form-error { color: var(--error-color); font-size: var(--font-size-sm); margin-top: var(--spacing-1); display: none; }
        .form-error.show { display: block !important; }
        .general-error {
            margin-bottom: var(--spacing-4); padding: var(--spacing-3);
            background: #fef2f2; color: #b91c1c; border-radius: var(--radius-md);
            display: none;
        }
        .general-error.show { display: block !important; }
        .submit-button {
            width: 100%; background: var(--primary-color); color: var(--white);
            border: none; padding: var(--spacing-3); border-radius: var(--radius-md);
            font-size: var(--font-size-base); font-weight: 500; cursor: pointer;
        }
        .submit-button:hover:not(:disabled) { background: var(--primary-hover); }
        .submit-button:disabled { background: var(--gray-400); cursor: not-allowed; }
        .success-message {
            padding: var(--spacing-4); background: #ecfdf5; color: #047857;
            border-radius: var(--radius-md); margin-bottom: var(--spacing-4); display: none;
        }
        .success-message.show { display: block !important; }
        .back-link { text-align: center; margin-top: var(--spacing-6); }
        .back-link a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header-component></header-component>
    <main class="main-content">
        <div class="container">
            <div class="card">
                <div class="form-header">
                    <h1 class="form-title">忘记密码</h1>
                    <p class="form-subtitle">输入注册邮箱，我们将发送重置链接到您的邮箱</p>
                </div>
                <div class="form-error general-error" id="generalError"></div>
                <div class="success-message" id="successMessage">若该邮箱已注册，将收到重置邮件，请查收并点击链接设置新密码。</div>
                <form id="forgotForm">
                    <div class="form-group">
                        <label for="email" class="form-label">邮箱地址</label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="请输入注册邮箱" required>
                        <div class="form-error" id="emailError"></div>
                    </div>
                    <button type="submit" class="submit-button" id="submitBtn">发送重置邮件</button>
                </form>
                <div class="back-link">
                    <a href="/" id="backLink">返回首页</a> · <a href="#" id="loginLink">去登录</a>
                </div>
            </div>
        </div>
    </main>
    <footer-component></footer-component>

    <script src="/static/js/components/icons.js"></script>
    <script src="/static/js/utils/user-manager.js"></script>
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/login-modal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function withSecurityHint(message) {
                var text = String(message || '').trim();
                if (!text) return '申请失败，请稍后重试';
                if (text.indexOf('安全规则') !== -1) return text;
                if (text.indexOf('请求过于频繁') !== -1) {
                    return text + '（安全规则：忘记密码接口每IP每小时最多5次，同邮箱每小时最多3次）';
                }
                return text;
            }

            var form = document.getElementById('forgotForm');
            var submitBtn = document.getElementById('submitBtn');
            var generalError = document.getElementById('generalError');
            var successMessage = document.getElementById('successMessage');
            var emailError = document.getElementById('emailError');

            document.getElementById('loginLink').addEventListener('click', function(e) {
                e.preventDefault();
                document.dispatchEvent(new CustomEvent('showLoginModal'));
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                generalError.classList.remove('show');
                generalError.textContent = '';
                emailError.classList.remove('show');
                emailError.textContent = '';
                successMessage.classList.remove('show');

                var email = document.getElementById('email').value.trim();
                if (!email) {
                    emailError.textContent = '请输入邮箱';
                    emailError.classList.add('show');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '发送中...';
                try {
                    var res = await fetch('/api/auth/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    });
                    var data = await res.json();
                    if (res.ok) {
                        successMessage.classList.add('show');
                        form.querySelector('#email').value = '';
                    } else {
                        var rawMsg = (typeof data.detail === 'string' ? data.detail : (data.detail && data.detail.detail) || '申请失败，请稍后重试');
                        generalError.textContent = withSecurityHint(rawMsg);
                        generalError.classList.add('show');
                    }
                } catch (err) {
                    generalError.textContent = '网络错误，请稍后重试';
                    generalError.classList.add('show');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '发送重置邮件';
                }
            });
        });
    </script>
</body>
</html>

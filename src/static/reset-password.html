<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置新密码 - BlogN</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        .main-content { padding: var(--spacing-8) 0; min-height: calc(100vh - 200px); }
        .container { max-width: 500px; margin: 0 auto; padding: 0 var(--spacing-4); }
        .card {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: var(--card-padding);
            border: 1px solid var(--card-border);
        }
        .form-header { text-align: center; margin-bottom: var(--spacing-6); }
        .form-title { font-size: var(--font-size-2xl); font-weight: 600; color: var(--card-title-color); margin: 0 0 var(--spacing-2) 0; }
        .form-subtitle { color: var(--gray-600); font-size: var(--font-size-base); margin: 0; }
        .form-group { margin-bottom: var(--spacing-4); }
        .form-label { display: block; font-weight: 500; color: var(--gray-700); font-size: var(--font-size-sm); margin-bottom: var(--spacing-2); }
        .form-input {
            width: 100%; padding: var(--spacing-3);
            border: 1px solid var(--gray-300); border-radius: var(--radius-md);
            font-size: var(--font-size-base); box-sizing: border-box;
        }
        .form-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-color-alpha); }
        .form-input.error { border-color: var(--error-color); }
        .form-error { color: var(--error-color); font-size: var(--font-size-sm); margin-top: var(--spacing-1); display: none; }
        .form-error.show { display: block !important; }
        .form-hint { color: var(--gray-500); font-size: var(--font-size-sm); margin: 0 0 var(--spacing-2) 0; line-height: 1.4; }
        .general-error {
            margin-bottom: var(--spacing-4); padding: var(--spacing-3);
            background: var(--red-50); color: var(--red-700); border-radius: var(--radius-md);
            display: none;
        }
        .general-error.show { display: block !important; }
        .submit-button {
            width: 100%; background: var(--primary-color); color: var(--white);
            border: none; padding: var(--spacing-3); border-radius: var(--radius-md);
            font-size: var(--font-size-base); font-weight: 500; cursor: pointer;
        }
        .submit-button:hover:not(:disabled) { background: var(--primary-hover); }
        .submit-button:disabled { background: var(--gray-400); cursor: not-allowed; }
        .back-link { text-align: center; margin-top: var(--spacing-6); }
        .back-link a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .back-link a:hover { text-decoration: underline; }
        .invalid-token { text-align: center; padding: var(--spacing-6); color: var(--gray-600); display: none; }
        .invalid-token.show { display: block !important; }
    </style>
</head>
<body>
    <header-component></header-component>
    <main class="main-content">
        <div class="container">
            <div class="card" id="formCard">
                <div class="invalid-token" id="invalidToken">
                    <p>链接无效或已过期，请<a href="/forgot-password">重新申请</a>重置密码。</p>
                    <div class="back-link"><a href="/">返回首页</a></div>
                </div>
                <div id="formContent">
                    <div class="form-header">
                        <h1 class="form-title">设置新密码</h1>
                        <p class="form-subtitle">请输入您的新密码</p>
                    </div>
                    <div class="form-error general-error" id="generalError"></div>
                    <form id="resetForm">
                        <input type="hidden" id="token" name="token" value="">
                        <div class="form-group">
                            <label for="new_password" class="form-label">新密码</label>
                            <p class="form-hint">8–30 个字符，须包含大写字母、小写字母和数字，仅限可打印英文与符号（空格到 ~）。</p>
                            <input type="password" id="new_password" name="new_password" class="form-input" placeholder="请输入新密码" required minlength="8" maxlength="30">
                            <div class="form-error" id="newPasswordError"></div>
                        </div>
                        <div class="form-group">
                            <label for="confirm_password" class="form-label">确认密码</label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="再次输入新密码" required>
                            <div class="form-error" id="confirmPasswordError"></div>
                        </div>
                        <button type="submit" class="submit-button" id="submitBtn">确认重置</button>
                    </form>
                    <div class="back-link">
                        <a href="/">返回首页</a> · <a href="#" id="loginLink">去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer-component></footer-component>

    <script src="/static/js/components/icons.js"></script>
    <script src="/static/js/utils/user-manager.js"></script>
    <script src="/static/js/utils/password-validation.js"></script>
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/login-modal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function withSecurityHint(message) {
                var text = String(message || '').trim();
                if (!text) return '重置失败，请稍后重试';
                if (text.indexOf('安全规则') !== -1) return text;
                if (text.indexOf('请求过于频繁') !== -1) {
                    return text + '（安全规则：重置相关接口有频率限制，请稍后再试）';
                }
                return text;
            }

            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var formContent = document.getElementById('formContent');
            var invalidToken = document.getElementById('invalidToken');
            var tokenInput = document.getElementById('token');
            var form = document.getElementById('resetForm');
            var submitBtn = document.getElementById('submitBtn');
            var generalError = document.getElementById('generalError');

            document.getElementById('loginLink').addEventListener('click', function(e) {
                e.preventDefault();
                document.dispatchEvent(new CustomEvent('showLoginModal'));
            });

            if (!token) {
                invalidToken.classList.add('show');
                formContent.style.display = 'none';
                return;
            }
            tokenInput.value = token;

            fetch('/api/auth/validate-reset-token?token=' + encodeURIComponent(token))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (!data.valid) {
                        invalidToken.classList.add('show');
                        formContent.style.display = 'none';
                    }
                })
                .catch(function() {
                    invalidToken.classList.add('show');
                    formContent.style.display = 'none';
                });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                generalError.classList.remove('show');
                generalError.textContent = '';
                var newPasswordEl = document.getElementById('new_password');
                var confirmEl = document.getElementById('confirm_password');
                var newPasswordError = document.getElementById('newPasswordError');
                var confirmError = document.getElementById('confirmPasswordError');
                newPasswordError.classList.remove('show');
                newPasswordError.textContent = '';
                confirmError.classList.remove('show');
                confirmError.textContent = '';

                var newPassword = newPasswordEl.value;
                var confirmPassword = confirmEl.value;
                var pwdErr = window.passwordRuleError(newPassword);
                if (pwdErr) {
                    newPasswordError.textContent = pwdErr;
                    newPasswordError.classList.add('show');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    confirmError.textContent = '两次输入的密码不一致';
                    confirmError.classList.add('show');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = '提交中...';
                try {
                    var res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, new_password: newPassword })
                    });
                    var data = await res.json();
                    if (res.ok) {
                        window.location.href = '/?password_reset=1';
                    } else {
                        var rawMsg = (typeof data.detail === 'string' ? data.detail : (data.detail && data.detail.detail) || '重置失败，请稍后重试');
                        generalError.textContent = withSecurityHint(rawMsg);
                        generalError.classList.add('show');
                    }
                } catch (err) {
                    generalError.textContent = '网络错误，请稍后重试';
                    generalError.classList.add('show');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '确认重置';
                }
            });
        });
    </script>
</body>
</html>

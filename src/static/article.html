<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客文章 - BlogN</title>
    <meta name="description" content="BlogN2博客文章页面，展示博客文章详细内容和评论">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- RSS自动发现链接 -->
    <link rel="alternate" type="application/rss+xml" title="博客RSS" href="/api/rss/blog/4">
    <link rel="alternate" type="application/atom+xml" title="博客Atom" href="/api/rss/blog/4?format=atom">
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- 左边栏 -->
                <aside class="sidebar sidebar-left">
                    <!-- 用户头像和博客名称 -->
                    <blog-profile-card></blog-profile-card>

                    <!-- 博客导航 -->
                    <blog-navigation-card></blog-navigation-card>



                    <!-- 最近评论 -->
                    <recent-comments-card></recent-comments-card>

                    <!-- 最近更新的博客 -->
                    <recent-updates-card></recent-updates-card>

                    <!-- 外站链接 -->
                    <friend-links-card></friend-links-card>
                </aside>

                <!-- 右边栏 -->
                <aside class="sidebar sidebar-right">
                    <!-- 文章头部信息 -->
                    <article-header-card></article-header-card>

                    <!-- 文章内容 -->
                    <article-content-card></article-content-card>

                    <!-- 评论区 -->
                    <article-comments-card></article-comments-card>

                    <!-- 评论设置 -->
                    <comment-settings-card></comment-settings-card>

                    <!-- 评论表单 -->
                    <comment-form-card></comment-form-card>
                </aside>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- Markdown解析库 -->
    <script src="/static/js/libs/marked.min.js"></script>

    <!-- 图标库 -->
    <script src="/static/js/components/icons.js"></script>

    <!-- 用户管理工具 -->
    <script src="/static/js/utils/user-manager.js"></script>

    <!-- Web Components -->
        <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/utils/confirm-dialog.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/blog-profile-card.js"></script>
    <script src="/static/js/components/blog-navigation-card.js"></script>
    <script src="/static/js/components/navigation-card.js"></script>
    <script src="/static/js/components/recent-comments-card.js"></script>
    <script src="/static/js/components/recent-updates-card.js"></script>
    <script src="/static/js/components/friend-links-card.js"></script>
    <script src="/static/js/components/article-header-card.js"></script>
    <script src="/static/js/components/article-content-card.js"></script>
    <script src="/static/js/components/comment-settings-card.js"></script>
    <script src="/static/js/components/article-comments-card.js"></script>
    <script src="/static/js/components/comment-form-card.js"></script>
    <!-- 移动端左侧栏折叠（合并布局时仅显示标题，可展开/收起） -->
    <script src="/static/js/sidebar-collapse.js"></script>

    <!-- RSS自动发现脚本 -->
    <script src="/static/js/rss-discovery.js"></script>
</body>
</html>

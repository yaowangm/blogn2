<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言本 - BlogN</title>
    <meta name="description" content="BlogN留言本，与用户交流互动">
    <meta name="keywords" content="留言本,博客,交流,互动">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- 预加载关键资源 -->
    <link rel="preload" href="/static/css/main.css" as="style">
    <link rel="preload" href="/static/css/components.css" as="style">
    <link rel="preload" href="/static/js/components/base-component.js" as="script">

    <!-- 样式文件 -->
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <!-- RSS自动发现 -->
    <link rel="alternate" type="application/rss+xml" title="BlogN 全站RSS" href="/api/rss/site">

<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- 左边栏 -->
                <aside class="sidebar sidebar-left">
                    <!-- 全站导航卡片 -->
                    <navigation-card></navigation-card>

                    <!-- 最近评论列表 -->
                    <recent-comments-card></recent-comments-card>

                    <!-- 友情链接 -->
                    <friend-links-card></friend-links-card>
                </aside>

                <!-- 右边栏 -->
                <aside class="sidebar sidebar-right">
                    <!-- 留言本列表 -->
                    <messages-list-card></messages-list-card>

                    <!-- 分页导航 -->
                    <navigation-card mode="pagination"></navigation-card>

                    <!-- 发表新留言表单 -->
                    <new-message-form></new-message-form>
                </aside>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- 图标库 -->
    <script src="/static/js/components/icons.js"></script>

    <!-- 用户管理工具 -->
    <script src="/static/js/utils/user-manager.js"></script>

    <!-- Web Components -->
        <script src="/static/js/utils/html-utils.js"></script>
<script src="/static/js/utils/confirm-dialog.js"></script>
<script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/navigation-card.js"></script>
    <script src="/static/js/components/recent-comments-card.js"></script>
    <script src="/static/js/components/friend-links-card.js"></script>

    <script src="/static/js/components/new-message-form.js"></script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理友情链接 - BlogN</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/management-pages.css">
</head>
<body>
    <header-component></header-component>

    <main class="main-content">
        <div class="container management-container">
            <div class="card">
                <div class="card-header">
                    <h1 class="card-title">
                        <span class="title-icon" id="friendLinksTitleIcon"></span>
                        <span id="pageTitleText">管理友情链接</span>
                    </h1>
                    <div class="btn-toolbar">
                        <button type="button" class="btn btn-primary btn-sm" id="addLinkBtn">
                            新建链接
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <p class="page-description" id="pageDescription">
                        管理您的博客友情链接，最多可添加 20 个友情链接
                    </p>
                    <div id="linksList">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer-component></footer-component>

    <script src="/static/js/components/icons.js"></script>
    <script src="/static/js/utils/user-manager.js"></script>
    <script src="/static/js/utils/confirm-dialog.js"></script>
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/manage-friend-links.js"></script>
    <script>
        document.getElementById('friendLinksTitleIcon').innerHTML = Icons.friendLinks;
        const addBtn = document.getElementById('addLinkBtn');
        if (addBtn && typeof Icons !== 'undefined') {
            addBtn.insertAdjacentHTML('afterbegin', Icons.add.replace('<svg ', '<svg width="16" height="16" aria-hidden="true" '));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 - BlogN</title>
    <meta name="description" content="BlogN个人资料页面，展示用户信息和博客统计">

    <!-- 安全设置：防止浏览器缓存敏感信息 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- 左边栏 -->
                <aside class="sidebar sidebar-left">
                    <!-- 用户头像和博客名称 -->
                    <blog-profile-card></blog-profile-card>
                </aside>

                <!-- 右边栏 -->
                <aside class="sidebar sidebar-right">
                    <!-- 个人资料卡片 -->
                    <user-profile-card></user-profile-card>

                    <!-- 博客信息卡片 -->
                    <blog-info-card></blog-info-card>

                    <!-- 管理员：管理工具 -->
                    <admin-tools-card></admin-tools-card>
                </aside>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- 图标库 -->
    <script src="/static/js/components/icons.js"></script>

    <!-- 用户管理工具 -->
    <script src="/static/js/utils/user-manager.js"></script>
    <script src="/static/js/utils/confirm-dialog.js"></script>

    <!-- Web Components -->
    <script src="/static/js/utils/html-utils.js"></script>
    <script src="/static/js/utils/password-validation.js"></script>
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/blog-profile-card.js"></script>
    <script src="/static/js/components/user-profile-card.js"></script>
    <script src="/static/js/components/blog-info-card.js"></script>
    <script src="/static/js/components/admin-tools-card.js"></script>
    <script src="/static/js/sidebar-collapse.js"></script>
    <!-- 个人资料页面脚本 -->
    <script src="/static/js/profile.js"></script>
</body>
</html>

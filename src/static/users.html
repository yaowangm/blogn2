<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户列表 - BlogN</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
        .main-content {
            padding: var(--spacing-8) 0;
            min-height: calc(100vh - 200px);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-4);
        }

        .page-header {
            margin-bottom: var(--spacing-6);
        }

        .page-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            color: var(--gray-900);
            margin: 0 0 var(--spacing-2) 0;
        }

        .page-description {
            color: var(--gray-600);
            font-size: var(--font-size-base);
        }

        .search-container {
            margin-bottom: var(--spacing-6);
        }

        .search-box {
            display: flex;
            align-items: center;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            flex: 1;
            padding: var(--spacing-3) var(--spacing-4);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            font-size: var(--font-size-base);
            background: var(--white);
            transition: var(--transition-fast);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .search-button,
        .clear-button {
            position: absolute;
            right: var(--spacing-2);
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--gray-500);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
        }

        .search-button:hover,
        .clear-button:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .clear-button {
            right: var(--spacing-10);
        }

        .search-button svg,
        .clear-button svg {
            width: 16px;
            height: 16px;
        }

        .table-container {
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            overflow: hidden;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th,
        .table td {
            padding: var(--spacing-4);
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
        }

        .table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-900);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table td {
            color: var(--gray-700);
            font-size: var(--font-size-sm);
        }

        .table tbody tr:hover {
            background: var(--gray-50);
        }

        .user-id {
            font-weight: 600;
            color: var(--primary-color);
        }

        .user-name {
            font-weight: 500;
            color: var(--gray-900);
        }

        .user-name-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .user-name-link:hover {
            text-decoration: underline;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: var(--spacing-1) var(--spacing-2);
            border-radius: var(--radius-full);
            font-size: var(--font-size-xs);
            font-weight: 500;
        }

        .status-badge.active {
            background: var(--green-100);
            color: var(--green-800);
        }

        .status-badge.admin {
            background: var(--blue-100);
            color: var(--blue-800);
        }

        .status-badge.frozen {
            background: var(--red-100);
            color: var(--red-800);
        }

        .user-point {
            font-weight: 600;
            color: var(--primary-color);
        }

        .user-blog-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .user-blog-link:hover {
            text-decoration: underline;
        }





        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-8);
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--gray-200);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-container {
            text-align: center;
            padding: var(--spacing-8);
            color: var(--red-600);
        }

        .empty-container {
            text-align: center;
            padding: var(--spacing-8);
            color: var(--gray-500);
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--spacing-4);
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 var(--spacing-4);
            }

            .table-container {
                overflow-x: auto;
            }

            .table {
                min-width: 600px;
            }


        }
    </style>
</head>
<body>
    <header-component></header-component>
    
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1 class="page-title">用户列表</h1>
                <p class="page-description">管理系统中的所有用户信息</p>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索用户名..." class="search-input">
                    <button id="searchButton" class="search-button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <button id="clearButton" class="clear-button" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="table-container">
                <div id="loadingContainer" class="loading-container">
                    <div class="loading-spinner"></div>
                </div>

                <div id="errorContainer" class="error-container" style="display: none;">
                    <p>加载用户列表失败，请稍后重试</p>
                </div>

                <div id="emptyContainer" class="empty-container" style="display: none;">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <p>暂无用户数据</p>
                </div>

                <table id="usersTable" class="table" style="display: none;">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>状态</th>
                            <th>注册时间</th>
                            <th>积分</th>
                            <th>博客链接</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>

            <navigation-card id="paginationCard"></navigation-card>
        </div>
    </main>

    <footer-component></footer-component>

    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
    <script src="/static/js/components/footer-component.js"></script>
    <script src="/static/js/components/navigation-card.js"></script>
    <script src="/static/js/components/icons.js"></script>
    <script src="/static/js/services/token-manager.js"></script>
    <script>
        /**
         * 用户列表页面管理类
         * 提供用户列表的分页显示、搜索和管理功能
         */
        class UsersListPage {
            constructor() {
                this.currentPage = 1;
                this.pageSize = 20;
                this.totalPages = 0;
                this.totalCount = 0;
                this.searchQuery = '';
                this.init();
            }

            /**
             * 初始化页面
             */
            async init() {
                await this.checkAdminPermission();
                await this.loadUsers();
                this.setupEventListeners();
            }

            /**
             * 检查管理员权限
             */
            async checkAdminPermission() {
                try {
                    const token = localStorage.getItem('access_token');
                    const userInfo = localStorage.getItem('user_info');
                    
                    if (!token || !userInfo) {
                        this.redirectToHome('请先登录');
                        return;
                    }

                    const user = JSON.parse(userInfo);
                    if (user.state !== 10) {
                        this.redirectToHome('需要管理员权限');
                        return;
                    }
                } catch (error) {
                    console.error('权限检查失败:', error);
                    this.redirectToHome('权限验证失败');
                }
            }

            /**
             * 重定向到首页并显示消息
             * @param {string} message - 提示消息
             */
            redirectToHome(message) {
                alert(message);
                window.location.href = '/';
            }

            /**
             * 加载用户列表数据
             * @param {number} page - 页码，默认为1
             */
            async loadUsers(page = 1) {
                try {
                    this.showLoading();
                    
                    const params = new URLSearchParams({
                        page: page.toString(),
                        page_size: this.pageSize.toString()
                    });
                    
                    if (this.searchQuery.trim()) {
                        params.append('search', this.searchQuery.trim());
                    }
                    
                    const response = await fetch(`/api/users/list?${params.toString()}`, {
                        headers: {
                            'Authorization': `Bearer ${localStorage.getItem('access_token')}`
                        }
                    });

                    if (!response.ok) {
                        if (response.status === 403) {
                            this.redirectToHome('需要管理员权限');
                            return;
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    this.currentPage = data.pagination.current_page;
                    this.totalPages = data.pagination.total_pages;
                    this.totalCount = data.pagination.total_count;

                    this.renderUsers(data.users);
                    this.renderPagination(data.pagination);
                    this.hideLoading();

                } catch (error) {
                    console.error('加载用户列表失败:', error);
                    this.showError();
                }
            }

            /**
             * 显示加载状态
             */
            showLoading() {
                this.setElementVisibility('loadingContainer', 'flex');
                this.setElementVisibility('errorContainer', 'none');
                this.setElementVisibility('emptyContainer', 'none');
                this.setElementVisibility('usersTable', 'none');
                document.getElementById('paginationCard').setPagination(null);
            }

            /**
             * 显示错误状态
             */
            showError() {
                this.setElementVisibility('loadingContainer', 'none');
                this.setElementVisibility('errorContainer', 'block');
                this.setElementVisibility('emptyContainer', 'none');
                this.setElementVisibility('usersTable', 'none');
                document.getElementById('paginationCard').setPagination(null);
            }

            /**
             * 隐藏加载状态
             */
            hideLoading() {
                this.setElementVisibility('loadingContainer', 'none');
            }

            /**
             * 设置元素显示状态
             * @param {string} elementId - 元素ID
             * @param {string} display - 显示状态
             */
            setElementVisibility(elementId, display) {
                const element = document.getElementById(elementId);
                if (element) {
                    element.style.display = display;
                }
            }

            /**
             * 渲染用户列表
             * @param {Array} users - 用户数据数组
             */
            renderUsers(users) {
                if (users.length === 0) {
                    this.setElementVisibility('emptyContainer', 'block');
                    this.setElementVisibility('usersTable', 'none');
                    return;
                }

                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = '';

                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="user-id">${user.id}</td>
                        <td class="user-name">
                            <a href="/profile/${user.id}" class="user-name-link" target="_blank">
                                ${this.escapeHtml(user.name)}
                            </a>
                        </td>
                        <td>
                            <span class="status-badge ${this.getStateClass(user.state)}">
                                ${this.getStateText(user.state)}
                            </span>
                        </td>
                        <td>${this.formatDate(user.regtime)}</td>
                        <td class="user-point">${user.point}</td>
                        <td>
                            ${user.projectid ? 
                                `<a href="/blog/${user.projectid}" class="user-blog-link" target="_blank">${user.project_name || '博客链接'}</a>` : 
                                '<span style="color: var(--gray-400);">-</span>'
                            }
                        </td>
                    `;
                    tbody.appendChild(row);
                });

                this.setElementVisibility('usersTable', 'table');
            }

            /**
             * 渲染分页组件
             * @param {Object} pagination - 分页信息对象
             */
            renderPagination(pagination) {
                const paginationCard = document.getElementById('paginationCard');
                paginationCard.setPagination(pagination, (page) => {
                    this.loadUsers(page);
                });
            }



            /**
             * 获取用户状态对应的CSS类名
             * @param {number} state - 用户状态
             * @returns {string} CSS类名
             */
            getStateClass(state) {
                switch (state) {
                    case 10: return 'admin';
                    case 1: return 'active';
                    case 0: return 'frozen';
                    default: return 'frozen';
                }
            }

            /**
             * 获取用户状态对应的文本
             * @param {number} state - 用户状态
             * @returns {string} 状态文本
             */
            getStateText(state) {
                switch (state) {
                    case 10: return '管理员';
                    case 1: return '正常';
                    case 0: return '冻结';
                    default: return '未知';
                }
            }

            /**
             * 格式化日期字符串
             * @param {string} dateString - 日期字符串
             * @returns {string} 格式化后的日期
             */
            formatDate(dateString) {
                if (!dateString) return '-';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch (error) {
                    return dateString;
                }
            }

            /**
             * HTML转义函数，防止XSS攻击
             * @param {string} text - 需要转义的文本
             * @returns {string} 转义后的安全文本
             */
            escapeHtml(text) {
                if (typeof text !== 'string') return text;
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            /**
             * 设置事件监听器
             */
            setupEventListeners() {
                const searchInput = document.getElementById('searchInput');
                const searchButton = document.getElementById('searchButton');
                const clearButton = document.getElementById('clearButton');
                
                if (searchInput) {
                    searchButton.addEventListener('click', () => this.performSearch());
                    searchInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            this.performSearch();
                        }
                    });
                    searchInput.addEventListener('input', () => this.toggleClearButton());
                }
                
                if (clearButton) {
                    clearButton.addEventListener('click', () => this.clearSearch());
                }
            }

            /**
             * 执行搜索
             */
            performSearch() {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    this.searchQuery = searchInput.value;
                    this.currentPage = 1;
                    this.loadUsers(1);
                }
            }

            /**
             * 清除搜索
             */
            clearSearch() {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    searchInput.value = '';
                    this.searchQuery = '';
                    this.currentPage = 1;
                    this.loadUsers(1);
                }
            }

            /**
             * 切换清除按钮显示状态
             */
            toggleClearButton() {
                const searchInput = document.getElementById('searchInput');
                const clearButton = document.getElementById('clearButton');
                
                if (searchInput && clearButton) {
                    this.setElementVisibility('clearButton', searchInput.value.trim() ? 'flex' : 'none');
                }
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            new UsersListPage();
        });
    </script>
</body>
</html>

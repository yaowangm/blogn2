<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogN - 博客平台</title>
    <meta name="description" content="BlogN是一个现代化的博客平台，提供丰富的博客功能和用户体验">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <!-- 预加载关键CSS资源 -->
    <link rel="preload" href="/static/css/main.css" as="style">
    <link rel="preload" href="/static/css/components.css" as="style">

    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <!-- RSS自动发现链接 -->
    <link rel="alternate" type="application/rss+xml" title="BlogN - 全站RSS" href="/api/rss/site">
    <link rel="alternate" type="application/atom+xml" title="BlogN - 全站Atom" href="/api/rss/site?format=atom">
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- 左边栏 -->
                <aside class="sidebar sidebar-left">
                    <!-- 网站统计卡片 -->
                    <stats-card></stats-card>

                    <!-- 全站导航卡片 -->
                    <navigation-card></navigation-card>

                    <!-- 最热门博客列表 -->
                    <popular-blogs-card></popular-blogs-card>

                    <!-- 最新加入博客列表 -->
                    <recent-blogs-card></recent-blogs-card>

                    <!-- 最近评论列表 -->
                    <recent-comments-card></recent-comments-card>

                    <!-- 友情链接 -->
                    <friend-links-card></friend-links-card>
                </aside>

                <!-- 右边栏 -->
                <aside class="sidebar sidebar-right">
                    <!-- 网站介绍 -->
                    <about-card></about-card>

                    <!-- 最近留言 -->
                    <recent-messages-card></recent-messages-card>

                    <!-- 最新博文摘要列表 -->
                    <blog-list-card></blog-list-card>
                </aside>
            </div>
        </div>
    </main>

    <!-- 底栏组件 -->
    <footer-component></footer-component>

    <!-- 图标库 -->
    <script defer src="/static/js/components/icons.js"></script>

    <!-- 用户管理工具 -->
    <script defer src="/static/js/utils/user-manager.js"></script>

    <!-- Web Components -->
    <script defer src="/static/js/utils/html-utils.js"></script>
    <script defer src="/static/js/utils/folder-filter.js"></script>
    <script defer src="/static/js/components/base-component.js"></script>
    <script defer src="/static/js/components/message-list-renderer.js"></script>
    <script defer src="/static/js/components/header-component.js"></script>
    <script defer src="/static/js/components/login-modal.js"></script>
    <script defer src="/static/js/components/footer-component.js"></script>
    <script defer src="/static/js/components/stats-card.js"></script>
    <script defer src="/static/js/components/navigation-card.js"></script>
    <script defer src="/static/js/components/recent-blogs-card.js"></script>
    <script defer src="/static/js/components/popular-blogs-card.js"></script>
    <script defer src="/static/js/components/recent-comments-card.js"></script>
    <script defer src="/static/js/components/friend-links-card.js"></script>
    <script defer src="/static/js/components/about-card.js"></script>
    <script defer src="/static/js/components/recent-messages-card.js"></script>
    <script defer src="/static/js/components/blog_list_card.js"></script>
    <script defer src="/static/js/sidebar-collapse.js"></script>

    <!-- RSS自动发现脚本 -->
    <script defer src="/static/js/rss-discovery.js"></script>
</body>
</html>

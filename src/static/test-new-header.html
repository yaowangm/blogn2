<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新头部界面测试 - BlogN</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
    <!-- 顶栏组件 -->
    <header-component></header-component>

    <!-- 测试内容 -->
    <main class="main-content">
        <div class="container">
            <h1>新头部界面测试</h1>
            <p>测试新的头部界面布局：</p>
            
            <div style="margin-top: 20px; padding: 20px; background: #f0f0f0; border-radius: 8px;">
                <h3>测试步骤：</h3>
                <ol>
                    <li><strong>未登录状态</strong>：应该只看到"登录"按钮，没有搜索图标</li>
                    <li><strong>登录后</strong>：应该只看到带头像的用户名，没有其他按钮</li>
                    <li><strong>点击用户名</strong>：应该显示下拉菜单，包含：
                        <ul>
                            <li>🔍 搜索</li>
                            <li>🏠 我的首页</li>
                            <li>🚪 退出</li>
                        </ul>
                    </li>
                    <li><strong>点击其他地方</strong>：下拉菜单应该自动关闭</li>
                </ol>
                
                <h3>改进内容：</h3>
                <ul>
                    <li>✅ 未登录时不显示搜索图标</li>
                    <li>✅ 登录状态下只显示带头像的用户名</li>
                    <li>✅ 点击用户名显示下拉菜单</li>
                    <li>✅ 下拉菜单包含搜索、我的首页、退出三项</li>
                    <li>✅ 点击其他地方自动关闭下拉菜单</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- Web Components -->
    <script src="/static/js/components/base-component.js"></script>
    <script src="/static/js/components/header-component.js"></script>
</body>
</html>

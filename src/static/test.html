<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogN2 - 组件测试</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background: var(--gray-100);
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .test-title {
            text-align: center;
            margin-bottom: 30px;
            color: var(--gray-900);
            font-size: 24px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1 class="test-title">BlogN2 动态组件测试</h1>
    
    <div class="test-container">
        <!-- 最新加入博客列表 -->
        <recent-blogs-card></recent-blogs-card>
        
        <!-- 最热门博客列表 -->
        <popular-blogs-card></popular-blogs-card>
        
        <!-- 最近评论列表 -->
        <recent-comments-card></recent-comments-card>
    </div>

    <!-- Web Components -->
    <script src="/static/js/components/recent-blogs-card.js"></script>
    <script src="/static/js/components/popular-blogs-card.js"></script>
    <script src="/static/js/components/recent-comments-card.js"></script>
</body>
</html>

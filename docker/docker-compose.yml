version: '3.8'

services:
  blogn2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blogn2-app
    restart: unless-stopped
    network_mode: "host"
    # 使用 host 网络模式以访问本地 PostgreSQL 和 Redis
    # ports:
    #   - "8000:8000"  # host 模式下不需要端口映射
    environment:
      # 配置文件路径（容器内路径，必须通过 volume 挂载）
      # 配置文件应包含所有应用配置（DATABASE_URL, CACHE_REDIS_HOST 等）
      - BLOGN_CONFIG_FILE=${BLOGN_CONFIG_FILE:-/app/config.env}
      # BERT 模型：默认路径，entrypoint 与 Python 会从挂载的 hub 自动解析到 snapshots/<revision>
      - MODEL_MODEL_PATH=/app/.cache/models/bert-model
      - MODEL_PREFER_LOCAL=true
      # 宿主机模型路径（仅用于启动日志显示，与 volume 挂载源一致）
      - BERT_MODEL_HOST_PATH=${BERT_MODEL_HUB_HOST_PATH:-}
      - MODEL_CACHE_DIR=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      # 容器内使用固定路径；宿主机目录由 .env 的 UPLOAD_DIR/AVATAR_DIR 提供，compose 挂载到容器
      - UPLOAD_DIR=/app/uploads
      - AVATAR_DIR=/app/avatars
    volumes:
      # 挂载配置文件（从项目根目录的 .env 或 docker/config.env）
      # 如果使用项目根目录的 .env 文件：
      - ../.env:/app/config.env:ro
      # 或者使用 docker 目录下的配置文件：
      # - ./config.env:/app/config.env:ro
      
      # 挂载上传/头像目录：宿主机路径由 运行 docker-compose 时的环境 提供（见下方说明）
      # 请从项目根目录执行：docker-compose -f docker/docker-compose.yml up
      # 这样会使用项目根 .env 中的 UPLOAD_DIR、AVATAR_DIR 做卷挂载；若从 docker/ 目录执行且未设置这两项，会挂载 ../uploads、../avatars（常为空，导致图片不显示）
      - ${UPLOAD_DIR:-../uploads}:/app/uploads
      - ${AVATAR_DIR:-../avatars}:/app/avatars
      
      # HuggingFace 缓存（宿主机路径可在 .env 中设置 HF_CACHE_HOST_PATH、BERT_MODEL_HUB_HOST_PATH 覆盖）
      - ${HF_CACHE_HOST_PATH:-/home/wy/.cache/huggingface}:/app/.cache/huggingface:ro
      - ${MODELSCOPE_CACHE_HOST_PATH:-/home/wy/.cache/modelscope}:/app/.cache/modelscope:ro
      # BERT 模型：宿主机上 HF hub 目录（含 snapshots/ 子目录），可在 .env 中设置 BERT_MODEL_HUB_HOST_PATH
      - ${BERT_MODEL_HUB_HOST_PATH:-/home/wy/.cache/huggingface/hub/models--sentence-transformers--paraphrase-multilingual-MiniLM-L12-v2}:/app/.cache/models/bert-model-hub:ro
    # 使用 host 网络模式，不需要 networks 配置
    # networks:
    #   - blogn2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 使用 host 网络模式，不需要 networks 配置
# networks:
#   blogn2-network:
#     driver: bridge


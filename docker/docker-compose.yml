version: '3.8'

services:
  blogn2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: blogn2-app
    restart: unless-stopped
    network_mode: "host"
    # 使用 host 网络模式以访问本地 PostgreSQL 和 Redis
    # ports:
    #   - "8000:8000"  # host 模式下不需要端口映射
    environment:
      # 配置文件路径（容器内路径，必须通过 volume 挂载）
      # 配置文件应包含所有应用配置（DATABASE_URL, CACHE_REDIS_HOST 等）
      - BLOGN_CONFIG_FILE=${BLOGN_CONFIG_FILE:-/app/config.env}
    volumes:
      # 挂载配置文件（从项目根目录的 .env 或 docker/config.env）
      # 如果使用项目根目录的 .env 文件：
      - ../.env:/app/config.env:ro
      # 或者使用 docker 目录下的配置文件：
      # - ./config.env:/app/config.env:ro
      
      # 挂载上传目录（持久化存储，路径相对于项目根目录）
      - ../uploads:/app/uploads
      - ../avatars:/app/avatars
      
      # 挂载本地模型缓存目录（使用 host 路径）
      # 注意：需要根据实际路径修改，或使用环境变量 MODEL_CACHE_HOST_PATH
      - /home/wy/.cache/huggingface:/app/.cache/huggingface:ro
      - /home/wy/.cache/modelscope:/app/.cache/modelscope:ro
    # 使用 host 网络模式，不需要 networks 配置
    # networks:
    #   - blogn2-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 使用 host 网络模式，不需要 networks 配置
# networks:
#   blogn2-network:
#     driver: bridge


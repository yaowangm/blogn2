[pytest]
# 测试发现配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试配置
asyncio_mode = auto

# 测试输出配置
addopts = 
    -v
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=0
    --no-cov-on-fail
    --disable-warnings
    -W ignore::ResourceWarning
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    -W ignore::UserWarning
    -W ignore::FutureWarning

# 过滤所有 pytest 收集/运行阶段的警告，避免输出 "1 warning"
filterwarnings =
    ignore

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    api: API测试

# 最小版本要求
minversion = 6.0

# 测试超时设置（秒）
timeout = 30

# 并行测试配置
# addopts = -n auto 
